<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Shaggie Simulator 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f6eee2;font:15px system-ui;overflow:hidden;touch-action:none}canvas{display:block}.top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:18px 22px;font-weight:900;letter-spacing:.3em;pointer-events:none}.top span{color:#f4b678}.panel{position:absolute;bottom:0;left:0;right:0;padding:25px 22px calc(25px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0d141ef5 15%);text-align:center}.step{color:#f4b678;letter-spacing:.2em;font-size:12px}h1{font-size:30px;margin:8px 0}p{color:#b7c3ce;line-height:1.5;min-height:44px}button{border:0;border-radius:14px;background:#f4b678;padding:15px 20px;font-weight:800;font-size:15px;margin:5px;color:#1b1511}.secondary{background:#293544;color:#fff}.bar{height:5px;border-radius:8px;background:#344250;margin:16px 0}.fill{height:100%;width:0;background:#f4b678;border-radius:8px}#mic{font-size:12px;color:#9daebd}.hint{position:absolute;top:44%;width:100%;text-align:center;pointer-events:none;color:#f8d3a3;letter-spacing:.15em;font-weight:bold}</style><div class="top">SHAG<span>//</span>STUDIO</div><div class="hint" id="hint">← VEEG OVER DE SHAG →</div><div class="panel"><div class="step" id="step">01 / 04</div><h1 id="title">Verdeel de shag</h1><p id="desc">Veeg horizontaal over het vloeitje om de shag te verdelen.</p><div class="bar"><div class="fill" id="fill"></div></div><button class="secondary" id="reset">↻ Opnieuw</button><button id="next">Volgende stap →</button><div id="mic"></div></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0x10151c);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,6,13);camera.lookAt(0,0,0);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;document.body.prepend(r.domElement);scene.add(new T.HemisphereLight(0xd8e5ff,0x302014,2));let light=new T.DirectionalLight(0xffcf9b,3);light.position.set(-4,9,6);light.castShadow=true;scene.add(light);let desk=new T.Mesh(new T.BoxGeometry(30,.3,25),new T.MeshStandardMaterial({color:0x283540,roughness:.9}));desk.position.y=-.5;desk.receiveShadow=true;scene.add(desk);
const root=new T.Group();scene.add(root);let paper=new T.Mesh(new T.PlaneGeometry(7.5,2.7,40,10),new T.MeshStandardMaterial({color:0xf1e7d4,side:T.DoubleSide,roughness:.9}));paper.rotation.x=-Math.PI/2;paper.position.y=.06;root.add(paper);let glue=new T.Mesh(new T.PlaneGeometry(7.4,.23),new T.MeshStandardMaterial({color:0xa7d1b7,side:T.DoubleSide,transparent:true,opacity:.65}));glue.rotation.x=-Math.PI/2;glue.position.set(0,.09,-1.2);root.add(glue);let shag=new T.Group();root.add(shag);for(let i=0;i<240;i++){let m=new T.Mesh(new T.CylinderGeometry(.012,.02,.12+Math.random()*.36,4),new T.MeshStandardMaterial({color:Math.random()>.5?0x89522d:0x4c2d1c}));m.rotation.z=Math.PI/2+(Math.random()-.5)*.6;m.position.set((Math.random()-.5)*6.8,.12+Math.random()*.1,(Math.random()-.5)*1.2);shag.add(m)}let cig=new T.Group();root.add(cig);let tube=new T.Mesh(new T.CylinderGeometry(.25,.25,7.4,40),new T.MeshStandardMaterial({color:0xf1e7d4}));tube.rotation.z=Math.PI/2;cig.add(tube);let filter=new T.Mesh(new T.CylinderGeometry(.252,.252,.8,40),new T.MeshStandardMaterial({color:0xb68a51}));filter.rotation.z=Math.PI/2;filter.position.x=3.3;cig.add(filter);let emberMaterial=new T.MeshStandardMaterial({color:0x888078});let ember=new T.Mesh(new T.CylinderGeometry(.252,.252,.08,40),emberMaterial);ember.rotation.z=Math.PI/2;ember.position.x=-3.72;cig.add(ember);let glow=new T.PointLight(0xff4c16,0,3);glow.position.x=-3.72;cig.add(glow);cig.position.y=.5;let smoke=[];for(let i=0;i<20;i++){let s=new T.Mesh(new T.SphereGeometry(1,10,8),new T.MeshBasicMaterial({color:0xdce4ef,transparent:true,opacity:.1,depthWrite:false}));scene.add(s);smoke.push(s)}
let phase=0,progress=0,lit=false,down=null,analyser=null,stream=null,lastClick=0;const titles=['Verdeel de shag','Rol het vloeitje','Bevochtig de plakrand','Steek hem aan'],descs=['Veeg horizontaal over het vloeitje om de shag te verdelen.','Veeg omhoog om het papier rond de shag te rollen.','Veeg langs de groene plakrand. Gebruik liever je vinger dan je tong.','Laat de microfoon een aanstekerklik herkennen of test de ontsteking.'],hints=['← VEEG OVER DE SHAG →','↑ VEEG OM TE ROLLEN ↑','← VEEG OVER DE PLAKRAND →','♪ KLIK MET JE AANSTEKER'];function ui(){$('step').textContent='0'+(phase+1)+' / 04';$('title').textContent=titles[phase];$('desc').textContent=descs[phase];$('hint').textContent=lit?'✦ ONTSTOKEN':hints[phase];$('fill').style.width=progress+'%';$('next').textContent=phase===3?(lit?'Nog een keer ↻':'Test ontsteking ✦'):'Volgende stap →';paper.visible=phase<2;shag.visible=phase<2;glue.visible=phase<3;cig.visible=phase>=2;filter.visible=phase===3}function reset(){phase=0;progress=0;lit=false;paper.rotation.x=-Math.PI/2;paper.position.y=.06;glue.material.opacity=.65;ember.material=emberMaterial;glow.intensity=0;ui()}function ignite(){if(lit||phase!==3)return;lit=true;ember.material=new T.MeshStandardMaterial({color:0xff6922,emissive:0xff3900,emissiveIntensity:3});glow.intensity=4;progress=100;ui()}async function mic(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});let ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();analyser=ctx.createAnalyser();analyser.fftSize=1024;ctx.createMediaStreamSource(stream).connect(analyser);$('mic').textContent='● Microfoon actief: detectie van scherpe klikgeluiden'}catch(e){$('mic').textContent='Microfoon niet beschikbaar. Gebruik Test ontsteking.'}}$('next').onclick=()=>{if(phase===3){lit?reset():ignite();return}if(progress<100){$('hint').textContent='VOLTOOI EERST DE BEWEGING';return}phase++;progress=0;ui();if(phase===3)mic()};$('reset').onclick=reset;r.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};r.domElement.setPointerCapture(e.pointerId)});r.domElement.addEventListener('pointermove',e=>{if(!down||phase===3)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;down={x:e.clientX,y:e.clientY};let amount=phase===1?Math.max(0,-dy)*.5:Math.abs(dx)*.25;progress=Math.min(100,progress+amount);if(phase===0)shag.rotation.y+=dx*.0007;if(phase===1){paper.rotation.x=-Math.PI/2+progress/100*.85;paper.position.y=.06+progress/100*.2}if(phase===2)glue.material.opacity=.65-progress/200;$('fill').style.width=progress+'%';if(progress===100)$('hint').textContent='✓ KLAAR'});r.domElement.addEventListener('pointerup',()=>down=null);r.domElement.addEventListener('pointercancel',()=>down=null);
let data=new Uint8Array(1024),time=0;function animate(){requestAnimationFrame(animate);time+=.016;root.rotation.y=Math.sin(time*.3)*.04;if(analyser&&phase===3&&!lit){analyser.getByteTimeDomainData(data);let peak=0,diff=0,energy=0;for(let i=1;i<data.length;i++){let v=Math.abs(data[i]-128)/128;peak=Math.max(peak,v);energy+=v*v;diff+=Math.abs(data[i]-data[i-1])}if(peak>.38&&diff>1250&&Math.sqrt(energy/data.length)>.035&&performance.now()-lastClick>1200){lastClick=performance.now();ignite()}}smoke.forEach((s,i)=>{s.visible=lit;if(lit){let u=(time*.22+i/20)%1;s.position.set(-3.72+Math.sin(u*9+i)*.2,.6+u*3.5,Math.cos(u*7+i)*.2);s.scale.setScalar(.07+u*.4);s.material.opacity=.14*(1-u)}});if(lit)glow.intensity=3+Math.sin(time*9);r.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});ui();
</script></html>

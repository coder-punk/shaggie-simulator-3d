<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10100f"><title>SHAG / STUDIO 2.2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10100f;color:#f2e9d9;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{position:fixed;inset:0;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.header{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:15px;font-weight:850;letter-spacing:.28em}.logo b{color:#d69c63}.counter{font-size:11px;letter-spacing:.2em;color:#cbb49b}.guide{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.24em;color:#e5c29b;text-shadow:0 2px 12px #000}.bottom{position:absolute;bottom:0;left:0;right:0;padding:45px 24px calc(23px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0e1010 34%,#0e1010 100%)}.eyebrow{color:#d9a36e;font-size:11px;letter-spacing:.24em;font-weight:700}.heading{font-size:clamp(26px,8vw,37px);font-weight:750;letter-spacing:-.04em;margin:7px 0}.desc{font-size:14px;color:#b9b6ae;line-height:1.55;max-width:360px;margin:0 0 22px}.track{height:3px;background:#49443d;border-radius:4px;overflow:hidden;margin-bottom:20px}.meter{height:100%;width:0;background:#e0aa75;transition:width .1s}.actions{display:flex;gap:10px;pointer-events:auto}.actions button{flex:1;border:1px solid #655444;background:#dbad7c;color:#20160e;border-radius:13px;padding:15px 12px;font-size:14px;font-weight:750}.actions button.ghost{flex:0 0 58px;background:#292825;color:#d9c8b3;border-color:#4b4640}.status{font-size:11px;color:#a9a49b;margin-top:14px;min-height:16px}.dot{display:inline-block;width:7px;height:7px;background:#c78e58;border-radius:50%;margin-right:7px}.st const el=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color('#141412');scene.fog=new THREE.FogExp2('#141412',.045);const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe6d7bb,0x34231a,2.1));const key=new THREE.DirectionalLight(0xffd6a4,3.8);key.position.set(-3,8,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;scene.add(key);const rim=new THREE.PointLight(0xc7d7ff,42,18);rim.position.set(5,3,-4);scene.add(rim);
const wood=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x34251b,roughness:.92}));wood.rotation.x=-Math.PI/2;wood.position.y=-.21;wood.receiveShadow=true;scene.add(wood);const grain=new THREE.Group();scene.add(grain);for(let i=0;i<70;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.5+Math.random()*4,.002,.003+Math.random()*.007),new THREE.MeshBasicMaterial({color:i%2?0x503526:0x251912,transparent:true,opacity:.22}));m.position.set((Math.random()-.5)*17,-.205,(Math.random()-.5)*12);grain.add(m)}
const stage=new THREE.Group();scene.add(stage);stage.scale.setScalar(.73);const paperMat=new THREE.MeshStandardMaterial({color:0xf3e6c9,side:THREE.DoubleSide,roughness:.94,metalness:0});const adhesiveMat=new THREE.MeshStandardMaterial({color:0xc9b38d,roughness:.8,side:THREE.DoubleSide,transparent:true,opacity:.8});let paper,adhesive;const PW=7.2,PZ=2.65,segments=64;
function paperGeometry(amount,strip=false){const g=new THREE.BufferGeometry(),verts=[],uv=[],indices=[];const N=48, W=48;let a=Math.max(0,Math.min(1,amount));for(let j=0;j<=N;j++){let p=j/N;let z=-PZ/2+p*PZ;let theta=(p-.5)*Math.PI*1.92;let r=.39;let rolledZ=r*Math.sin(theta);let rolledY=.43+r*Math.cos(theta);let y=(1-a)*.035+a*rolledY;let zz=(1-a)*z+a*rolledZ;if(strip){p=.915+j/N*.085;z=-PZ/2+p*PZ;theta=(p-.5)*Math.PI*1.92;rolledZ=r*Math.sin(theta);rolledY=.43+r*Math.cos(theta);y=(1-a)*.04+a*rolledY+.007;zz=(1-a)*z+a*rolledZ}for(let i=0;i<=W;i++){let x=(i/W-.5)*PW;verts.push(x,y,zz);uv.push(i/W,p)}}for(let j=0;j<N;j++)for(let i=0;i<W;i++){let k=j*(W+1)+i,b=k+W+1;indices.push(k,b,k+1,b,b+1,k+1)}g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(indices);g.computeVertexNormals();return g}
paper=new THREE.Mesh(paperGeometry(0),paperMat);paper.castShadow=true;stage.add(paper);adhesive=new THREE.Mesh(paperGeometry(0,true),adhesiveMat);stage.add(adhesive);
const tobacco=new THREE.Group();stage.add(tobacco);const palette=[0x54301c,0x8b542c,0xb77a43,0x693a22,0xc38c55,0x3d271b];let strands=[];for(let i=0;i<520;i++){let len=.12+Math.random()*.32;const geo=new THREE.CylinderGeometry(.008+Math.random()*.006,.006,len,3);const mat=new THREE.MeshStandardMaterial({color:palette[Math.floor(Math.random()*palette.length)],roughness:1});const strand=new THREE.Mesh(geo,mat);strand.rotation.z=Math.PI/2+(Math.random()-.5)*1.2;strand.rotation.y=(Math.random()-.5)*.5;strand.position.set((Math.random()-.5)*6.7,.12+Math.random()*.13,(Math.random()-.5)*.78);strand.castShadow=i%8===0;tobacco.add(strand);strands.push(strand)}
const cigarette=new THREE.Group();stage.add(cigarette);const white=new THREE.MeshStandardMaterial({color:0xf0e3c8,roughness:.9});const tube=new THREE.Mesh(new THREE.CylinderGeometry(.245,.245,7.2,48,1),white);tube.rotation.z=Math.PI/2;tube.castShadow=true;cigarette.add(tube);const seam=new THREE.Mesh(new THREE.CylinderGeometry(.247,.247,6.2,48,1,true,0,.25),new THREE.MeshStandardMaterial({color:0xd6c9aa,side:THREE.DoubleSide,transparent:true,opacity:.45}));seam.rotation.z=Math.PI/2;cigarette.add(seam);const filter=new THREE.Mesh(new THREE.CylinderGeometry(.249,.249,.9,48),new THREE.MeshStandardMaterial({color:0xb88a4c,roughness:.93}));filter.rotation.z=Math.PI/2;filter.position.x=3.15;cigarette.add(filter);const tipMat=new THREE.MeshStandardMaterial({color:0x403a31,roughness:1});const tip=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.055,40),tipMat);tip.rotation.z=Math.PI/2;tip.position.x=-3.63;cigarette.add(tip);const glow=new THREE.PointLight(0xff4d13,0,2.4);glow.position.x=-3.7;cigarette.add(glow);cigarette.position.y=.33;
const smoke=[];for(let i=0;i<26;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshBasicMaterial({color:0xc9c8c4,transparent:true,opacity:0,depthWrite:false}));scene.add(m);smoke.push(m)}
let phase=0,progress=0,lit=false,drag=null,micStream=null,audioContext=null,analyser=null,lastSound=0;const headings=['De voorbereiding','De perfecte rol','De plakrand','Het laatste detail'],descs=['Beweeg je vinger over de tabak om deze gelijkmatig op het vloeitje te verdelen.','Veeg langzaam omhoog. Het dunne papier krult om de tabak heen.','Strijk met je vinger langs de plakrand om het papier te sluiten.','Laat de microfoon een aanstekerklik herkennen of gebruik de testknop.'],guides=['↔ VERDEEL DE TABAK ↔','↑ ROL HET PAPIER ↑','↔ STRIJK LANGS DE RAND ↔','♪ AANSTEKERKLIK'];function update(){el('count').textContent='0'+(phase+1)+' / 04';el('heading').textContent=headings[phase];el('desc').textContent=descs[phase];el('guide').textContent=lit?'✦ ONTSTOKEN ✦':guides[phase];el('meter').style.width=progress+'%';el('advance').textContent=phase===3?(lit?'Opnieuw beginnen ↺':'Test ontsteking ✦'):'Volgende stap →';paper.visible=phase<3;adhesive.visible=phase<3;tobacco.visible=phase<3;cigarette.visible=phase===3;el('status').innerHTML='<span class="dot"></span>'+(['Sleep over het papier','Veeg omhoog over het vloeitje','Volg de bovenste rand','Microfoon: '+(analyser?'actief':'toestemming nodig')][phase])}
function rollVisual(){let amt=phase===1?progress/100:phase>=2?1:0;paper.geometry.dispose();paper.geometry=paperGeometry(amt);adhesive.geometry.dispose();adhesive.geometry=paperGeometry(amt,true);tobacco.scale.z=1-amt*.64;tobacco.scale.y=1-amt*.5;tobacco.position.y=amt*.46;for(let i=0;i<strands.length;i++){const st=strands[i];st.visible=!(amt>.12&&st.position.y>0&&Math.abs(st.position.z)>.15&&i%3!==0);st.position.y=Math.max(.12,st.position.y);}adhesive.material.opacity=phase===2?Math.max(.12,.8-progress*.006):.8}

async function startMic(){if(analyser||!navigator.mediaDevices?.getUserMedia){update();return}try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});audioContext=new (window.AudioContext||window.webkitAudioContext)();await audioContext.resume();analyser=audioContext.createAnalyser();analyser.fftSize=1024;audioContext.createMediaStreamSource(micStream).connect(analyser)}catch(e){el('status').textContent='Geen microfoontoegang. Gebruik Test ontsteking.'}update()}
el('advance').onclick=()=>{if(phase===3){lit?reset():ignite();return}if(progress<95){el('status').textContent='Maak eerst de beweging af.';return}phase++;progress=0;rollVisual();update();if(phase===3)startMic()};el('restart').onclick=reset;const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{if(phase===3)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pointer,camera);let hit=raycaster.intersectObject(paper,false).length||raycaster.intersectObject(adhesive,false).length||raycaster.intersectObjects(tobacco.children,false).length;const projected=new THREE.Vector3(0,.5,0).applyMatrix4(stage.matrixWorld).project(camera);const cx=(projected.x+1)*innerWidth/2,cy=(1-projected.y)*innerHeight/2;hit=hit||(Math.abs(e.clientX-cx)<innerWidth*.43&&Math.abs(e.clientY-cy)<110);if(!hit){el('status').textContent='Raak het vloeitje aan om te beginnen';return}drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||phase===3)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};let delta=phase===1?Math.max(0,-dy)*.42:Math.abs(dx)*.34;progress=Math.min(100,progress+delta);if(phase===0){for(let i=0;i<strands.length;i+=13){strands[i].position.z*=.998}}rollVisual();el('meter').style.width=progress+'%';if(progress>=95)el('status').textContent='✓ Klaar voor de volgende stap'});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
